server {
    listen 3003;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback — let the client app handle routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ensure WASM is served with the correct MIME type (Stockfish engine)
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    # Cache hashed build assets aggressively; keep index.html uncached
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
